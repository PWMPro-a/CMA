# Customer CPA pool stack.
# The bootstrap script writes absolute paths and generated secrets to .env;
# direct docker compose users can copy .env.example to .env and fill the same
# variables before starting this file.
name: ${COMPOSE_PROJECT_NAME:-cpamp-cpa}

services:
  cli-proxy-api:
    image: ${CPA_IMAGE:?set CPA_IMAGE}
    pull_policy: ${CPA_PULL_POLICY:-always}
    container_name: ${CPA_CONTAINER_NAME:-cli-proxy-api}
    restart: unless-stopped
    command: ["./CLIProxyAPI", "-config", "/app/data/config.yaml"]
    labels:
      com.cpamp.managed: "true"
      com.cpamp.stack: "cpa"
      com.cpamp.role: "cpa"
      com.cpamp.service: "cli-proxy-api"
    # Host networking keeps the CPA port compatible with existing clients and
    # lets the manager reach it through host.docker.internal.
    network_mode: host
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CPA_PORT: "${CPA_PORT:-8317}"
      CPA_LICENSE_PROVIDER: "${CPA_LICENSE_PROVIDER:-shop666}"
      CPA_LICENSE_PRODUCT_CODE: "${CPA_LICENSE_PRODUCT_CODE:-CPA}"
      CPA_LICENSE_PUBLIC_KEY: "${CPA_LICENSE_PUBLIC_KEY:?set CPA_LICENSE_PUBLIC_KEY}"
      CPA_LICENSE_PLUGIN_PUBLIC_KEY: "${CPA_LICENSE_PLUGIN_PUBLIC_KEY:-}"
      CPA_LICENSE_CLIENT_ID: "${CPA_LICENSE_CLIENT_ID:-}"
      # Kept for backwards compatibility with older .env files. New installs
      # should leave this empty and use the Docker secret below.
      CPA_LICENSE_CLIENT_SECRET: "${CPA_LICENSE_CLIENT_SECRET:-}"
      # The client secret is mounted as a Docker secret, never copied into the
      # process environment or the public template.
      CPA_LICENSE_CLIENT_SECRET_FILE: "/run/secrets/cpa-license-client-secret"
      CPA_LICENSE_API_BASE_URL: "${CPA_LICENSE_API_BASE_URL:-https://p.666ttt.net/api/storefront}"
      CPA_LICENSE_STATE_DIR: "${CPA_LICENSE_STATE_DIR:-/CLIProxyAPI/data/license}"
      CPA_LICENSE_SHOP_AUTH_URL: "${CPA_LICENSE_SHOP_AUTH_URL:-https://p.666ttt.net/shop/?authorize=cpa}"
      CPA_LICENSE_SHOP_EXCHANGE_PATH: "${CPA_LICENSE_SHOP_EXCHANGE_PATH:-/licenses/exchange}"
      CPA_LICENSE_ACTIVATE_PATH: "${CPA_LICENSE_ACTIVATE_PATH:-/licenses/activate}"
      CPA_LICENSE_REFRESH_PATH: "${CPA_LICENSE_REFRESH_PATH:-/licenses/refresh}"
      CPA_LICENSE_VERIFY_PATH: "${CPA_LICENSE_VERIFY_PATH:-/licenses/verify}"
      CPA_LICENSE_GRACE_PATH: "${CPA_LICENSE_GRACE_PATH:-/licenses/grace}"
      CPA_LICENSE_REFRESH_INTERVAL: "${CPA_LICENSE_REFRESH_INTERVAL:-10m}"
      CPA_LICENSE_GRACE_PERIOD: "${CPA_LICENSE_GRACE_PERIOD:-6h}"
      CPA_LICENSE_STORAGE_KEY: "${CPA_LICENSE_STORAGE_KEY:-}"
      CPA_LICENSE_EXECUTABLE_SHA256: "${CPA_LICENSE_EXECUTABLE_SHA256:-}"
      CPA_LICENSE_CLAIM_PATH: "${CPA_LICENSE_CLAIM_PATH:-}"
      CPA_MANAGEMENT_KEY: "${CPA_MANAGEMENT_KEY:?set CPA_MANAGEMENT_KEY}"
    volumes:
      # One data directory is mounted at both historical CPA paths so the
      # license lease/installation identity survives image upgrades.
      - "${CPA_DATA_DIR:-./data/cpa}:/app/data"
      - "${CPA_DATA_DIR:-./data/cpa}:/CLIProxyAPI/data"
    secrets:
      - source: cpa_license_client_secret
        target: cpa-license-client-secret
    healthcheck:
      test: ["CMD-SHELL", "bash -ec 'exec 3<>/dev/tcp/127.0.0.1/$${CPA_PORT:-8317}'"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  cpamp-agent:
    image: ${CPAMP_IMAGE:?set CPAMP_IMAGE}
    pull_policy: ${CPAMP_PULL_POLICY:-always}
    container_name: ${CPAMP_AGENT_CONTAINER_NAME:-cpamp-agent}
    entrypoint: ["cpamp-agent"]
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW
    labels:
      com.cpamp.managed: "true"
      com.cpamp.stack: "cpa"
      com.cpamp.role: "agent"
      com.cpamp.service: "cpamp-agent"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      CPAMP_AGENT_ADDR: "0.0.0.0:${CPAMP_AGENT_PORT:-18417}"
      CPAMP_STACK_ROOT: "${CPAMP_STACK_ROOT:-.}"
      CPAMP_BACKUP_ROOT: "${CPAMP_BACKUP_ROOT:-./backups}"
      CPAMP_AGENT_TOKEN: "${CPAMP_AGENT_TOKEN:?set CPAMP_AGENT_TOKEN}"
      DOCKER_HOST: "unix:///var/run/docker.sock"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "${CPAMP_STACK_ROOT:-.}:${CPAMP_STACK_ROOT:-.}"
      - "${CPAMP_BACKUP_ROOT:-./backups}:${CPAMP_BACKUP_ROOT:-./backups}"
    healthcheck:
      test: ["CMD-SHELL", "wget --header='Authorization: Bearer '$$CPAMP_AGENT_TOKEN -qO- http://127.0.0.1:$${CPAMP_AGENT_PORT:-18417}/agent/info >/dev/null"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 5s

  cpa-manager-plus:
    image: ${CPAMP_IMAGE:?set CPAMP_IMAGE}
    pull_policy: ${CPAMP_PULL_POLICY:-always}
    container_name: ${CPAMP_CONTAINER_NAME:-cpa-manager-plus}
    restart: unless-stopped
    depends_on:
      cli-proxy-api:
        condition: service_healthy
      cpamp-agent:
        condition: service_healthy
    labels:
      com.cpamp.managed: "true"
      com.cpamp.stack: "cpa"
      com.cpamp.role: "cpamp"
      com.cpamp.service: "cpa-manager-plus"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      HTTP_ADDR: "0.0.0.0:${CPAMP_INTERNAL_PORT:-18317}"
      CPAMP_INTERNAL_PORT: "${CPAMP_INTERNAL_PORT:-18317}"
      USAGE_DB_PATH: "/data/usage.sqlite"
      CPA_MANAGER_DATA_KEY_PATH: "/data/data.key"
      CPA_UPSTREAM_URL: "http://host.docker.internal:${CPA_PORT:-8317}"
      CPA_MANAGEMENT_KEY_FILE: "/run/secrets/cpa-management-key"
      CPA_MANAGER_ADMIN_KEY_FILE: "/run/secrets/cpamp-admin-key"
      CPAMP_AGENT_URL: "http://host.docker.internal:${CPAMP_AGENT_PORT:-18417}"
      CPAMP_AGENT_TOKEN: "${CPAMP_AGENT_TOKEN:?set CPAMP_AGENT_TOKEN}"
      USAGE_COLLECTOR_MODE: "http"
      USAGE_RESP_QUEUE: "usage"
      USAGE_RESP_POP_SIDE: "right"
      USAGE_BATCH_SIZE: "100"
      USAGE_POLL_INTERVAL_MS: "500"
      USAGE_QUERY_LIMIT: "50000"
      USAGE_CORS_ORIGINS: "${USAGE_CORS_ORIGINS:-*}"
      USAGE_QUOTA_COOLDOWN_ENABLED: "${USAGE_QUOTA_COOLDOWN_ENABLED:-true}"
    networks:
      - cpamp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${CPAMP_PORT:-18317}:${CPAMP_INTERNAL_PORT:-18317}"
    volumes:
      - "${CPAMP_DATA_DIR:-./data/manager}:/data"
    secrets:
      - cpamp_admin_key
      - cpa_management_key
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:$${CPAMP_INTERNAL_PORT:-18317}/health"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

networks:
  cpamp:
    name: ${CPAMP_NETWORK_NAME:-cpamp-cpa_default}
    driver: bridge
    labels:
      com.cpamp.managed: "true"
      com.cpamp.stack: "cpa"

secrets:
  cpamp_admin_key:
    file: "${CPAMP_ADMIN_KEY_FILE:-./secrets/cpamp-admin-key}"
  cpa_management_key:
    file: "${CPA_MANAGEMENT_KEY_FILE:-./secrets/cpa-management-key}"
  cpa_license_client_secret:
    # The /dev/null fallback keeps legacy key-only/direct-secret deployments
    # startable; bootstrap.sh replaces it with a mode-600 local secret file.
    file: "${CPA_LICENSE_CLIENT_SECRET_HOST_PATH:-${CPA_LICENSE_CLIENT_SECRET_FILE:-/dev/null}}"
